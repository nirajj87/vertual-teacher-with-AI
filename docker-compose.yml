services:
  mysql:
    image: mysql:8.0
    container_name: avt-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ai_virtual_teacher
      MYSQL_USER: avt_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - avt-network

  redis:
    image: redis:7-alpine
    container_name: avt-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - avt-network

  backend:
    build:
      context: ./backend
      target: production
    container_name: avt-backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
      - redis
    networks:
      - avt-network

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: avt-frontend
    restart: always
    networks:
      - avt-network

  nginx:
    image: nginx:alpine
    container_name: avt-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - avt-network

volumes:
  mysql_data:
  redis_data:

networks:
  avt-network:
    driver: bridge
