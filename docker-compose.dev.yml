services:
  mysql:
    image: mysql:8.0
    container_name: avt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ai_virtual_teacher
      MYSQL_USER: avt_user
      MYSQL_PASSWORD: avt_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - avt-network

  redis:
    image: redis:7-alpine
    container_name: avt-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - avt-network

  backend:
    build:
      context: ./backend
      target: development
    container_name: avt-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - avt-network

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: avt-frontend
    restart: unless-stopped
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - avt-network

volumes:
  mysql_data:
  redis_data:

networks:
  avt-network:
    driver: bridge
